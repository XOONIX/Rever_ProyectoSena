name: CI - Pruebas y Cobertura (Rever API)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  test:
    name: Ejecución de Pruebas Automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Backend/Rever/rever.test/rever.test.csproj

      - name: Compilar proyecto (Release)
        run: dotnet build Backend/Rever/rever.test/rever.test.csproj --no-restore -c Release

      - name: Ejecutar pruebas y calcular cobertura de código
        run: dotnet test Backend/Rever/rever.test/rever.test.csproj --no-build -c Release --collect:"XPlat Code Coverage" --verbosity normal

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura
          path: '**/TestResults/**/coverage.cobertura.xml'
