# Configuración para SonarCloud / SonarQube
sonar.projectKey=Rever
sonar.projectName=Rever

# Exclusiones de análisis de código fuente
sonar.exclusions=coverage/**,**/coverage/**,**/bin/**,**/obj/**,**/*.spec.ts,**/*.test.cs

# Exclusiones de cálculo de cobertura
sonar.coverage.exclusions=coverage/**,**/coverage/**,**/test/**,**/*.test.cs,**/*.Tests.cs,Frontend/**

# Rutas de reportes de pruebas y cobertura
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx
