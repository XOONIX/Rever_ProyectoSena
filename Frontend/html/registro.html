<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Rever Inmobiliaria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor_principal">
        <div class="columna_izquierda">
            <div class="contenedor_formulario">
                <h1 class="titulo_formulario">Crear Cuenta</h1>
                
                <form id="formulario_registro" class="formulario_registro">
                    <div class="grupo_campo">
                        <label for="nombre_completo" class="etiqueta_campo">Nombre Completo</label>
                        <input type="text" id="nombre_completo" class="campo_entrada" placeholder="Juan Pérez García" required>
                    </div>
                    
                    <div class="grupo_campo">
                        <label for="correo_electronico" class="etiqueta_campo">Correo Electrónico</label>
                        <input type="email" id="correo_electronico" class="campo_entrada" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="grupo_campo">
                        <label for="telefono_contacto" class="etiqueta_campo">Teléfono de Contacto</label>
                        <input type="tel" id="telefono_contacto" class="campo_entrada" placeholder="+57 300 123 4567" required>
                    </div>
                    
                    <div class="grupo_campo">
                        <label for="contrasena" class="etiqueta_campo">Contraseña</label>
                        <div class="contenedor_contrasena">
                            <input type="password" id="contrasena" class="campo_entrada" placeholder="••••••••" required>
                            <button type="button" class="boton_ojo" onclick="alternar_visibilidad_contrasena('contrasena', this)">
                                <svg class="icono_ojo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="grupo_campo">
                        <label for="confirmar_contrasena" class="etiqueta_campo">Confirmar Contraseña</label>
                        <div class="contenedor_contrasena">
                            <input type="password" id="confirmar_contrasena" class="campo_entrada" placeholder="••••••••" required>
                            <button type="button" class="boton_ojo" onclick="alternar_visibilidad_contrasena('confirmar_contrasena', this)">
                                <svg class="icono_ojo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="grupo_campo">
                        <label for="tipo_usuario" class="etiqueta_campo">Registrarme como</label>
                        <select id="tipo_usuario" class="campo_entrada" required>
                            <option value="" disabled selected>Selecciona un rol</option>
                            <option value="2">Comprador</option>
                            <option value="3">Vendedor</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="boton_principal">Registrarse</button>
                </form>
                
                <div class="separador">
                    <span class="texto_separador">o continúa con</span>
                </div>
                
                <button class="boton_google">
                    <svg class="icono_google" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                
                <div class="enlaces_formulario">
                    <p class="texto_pregunta">¿Ya tienes cuenta? <a href="login.html" class="enlace_registro_dorado">Inicia sesión aquí</a></p>
                </div>
                
                <p class="texto_copyright">© 2026 Rever Inmobiliaria. Todos los derechos reservados.</p>
            </div>
        </div>
        
        <div class="columna_derecha">
            <div class="contenedor_imagen">
                <div class="superposicion_texto">
                    <h2 class="titulo_imagen">Encuentra tu hogar ideal</h2>
                    <p class="subtitulo_imagen">Gestionamos propiedades excepcionales para ti</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function alternar_visibilidad_contrasena(id_campo, boton) {
            var campo = document.getElementById(id_campo);
            var icono = boton.querySelector('.icono_ojo');
            
            if (campo.type === 'password') {
                campo.type = 'text';
                icono.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                campo.type = 'password';
                icono.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }
    </script>
    <script>
        document.getElementById('formulario_registro').addEventListener('submit', async function(e) {
            e.preventDefault();

            const botonSubmit = e.target.querySelector('button[type="submit"]');
            botonSubmit.disabled = true;
            botonSubmit.textContent = 'Registrando...';

            const contrasena = document.getElementById('contrasena').value;
            const confirmarContrasena = document.getElementById('confirmar_contrasena').value;

            if (contrasena !== confirmarContrasena) {
                alert('Las contraseñas no coinciden.');
                botonSubmit.disabled = false;
                botonSubmit.textContent = 'Registrarse';
                return;
            }

            const datos = {
                nombre: document.getElementById('nombre_completo').value,
                correo: document.getElementById('correo_electronico').value,
                telefono: document.getElementById('telefono_contacto').value,
                contraseña: contrasena,
                idRol: parseInt(document.getElementById('tipo_usuario').value)
            };

            try {
                const response = await fetch('https://localhost:7015/api/Registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const textoRespuesta = await response.text();
                let mensaje = textoRespuesta;

                try {
                    const json = JSON.parse(textoRespuesta);
                    mensaje = json.title || json.message || JSON.stringify(json);
                } catch {
                    // No era JSON, se queda como texto plano
                }

                if (!response.ok) {
                    throw new Error(mensaje || 'Error al registrar usuario');
                }

                alert('¡Cuenta creada con éxito!');
                window.location.href = 'login.html';

            } catch (error) {
                alert('Error: ' + error.message);
                console.error(error);
                botonSubmit.disabled = false;
                botonSubmit.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
