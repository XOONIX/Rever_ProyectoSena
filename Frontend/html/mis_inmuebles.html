<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Inmuebles - Rever Inmobiliaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/mis_inmuebles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       PANTALLA — MIS INMUEBLES (VENDEDOR)
  ═══════════════════════════════════════════════════════ -->
  <div id="pantalla_mis_inmuebles" class="pantalla_mis_inmuebles">

    <!-- Encabezado -->
    <header class="encabezado_mis_inmuebles">
      <div class="contenedor_encabezado">
        <button class="boton_volver" onclick="volver_a_inicio()" aria-label="Volver al inicio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver
        </button>
        <div>
          <h1 class="titulo_encabezado">Mis Inmuebles</h1>
          <p class="subtitulo_encabezado">Gestiona tus propiedades publicadas</p>
        </div>
        <button class="boton_publicar" onclick="ir_a_publicar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Publicar
        </button>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="contenido_mis_inmuebles">

      <!-- Filtros y estadísticas -->
      <section class="seccion_filtros_estadisticas">
        <div class="estadisticas_rapidas">
          <div class="tarjeta_estadistica_small">
            <span class="icono_estadistica">🏠</span>
            <div>
              <p class="valor_estadistica" id="total_inmuebles">0</p>
              <p class="etiqueta_estadistica">Total</p>
            </div>
          </div>
          <div class="tarjeta_estadistica_small">
            <span class="icono_estadistica">✅</span>
            <div>
              <p class="valor_estadistica" id="inmuebles_activos">0</p>
              <p class="etiqueta_estadistica">Activos</p>
            </div>
          </div>
          <div class="tarjeta_estadistica_small">
            <span class="icono_estadistica">⏳</span>
            <div>
              <p class="valor_estadistica" id="inmuebles_pendientes">0</p>
              <p class="etiqueta_estadistica">Pendientes</p>
            </div>
          </div>
          <div class="tarjeta_estadistica_small">
            <span class="icono_estadistica">❌</span>
            <div>
              <p class="valor_estadistica" id="inmuebles_inactivos">0</p>
              <p class="etiqueta_estadistica">Inactivos</p>
            </div>
          </div>
        </div>

        <div class="barra_filtros">
          <button class="filtro_activo" data-filtro="todos" onclick="aplicar_filtro('todos', this)">Todos</button>
          <button class="filtro" data-filtro="activo" onclick="aplicar_filtro('activo', this)">Activos</button>
          <button class="filtro" data-filtro="pendiente" onclick="aplicar_filtro('pendiente', this)">Pendientes</button>
          <button class="filtro" data-filtro="inactivo" onclick="aplicar_filtro('inactivo', this)">Inactivos</button>
        </div>
      </section>

      <!-- Grid de inmuebles -->
      <section class="seccion_inmuebles">
        <div id="grid_inmuebles" class="grid_inmuebles" role="list" aria-label="Mis inmuebles publicados">
          <!-- Inyectado por JavaScript -->
        </div>

        <!-- Estado vacío -->
        <div id="estado_vacio" class="estado_vacio oculto" role="status">
          <div class="icono_vacio">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <h3 class="titulo_vacio">No tienes inmuebles publicados</h3>
          <p class="descripcion_vacio">Comienza publicando tu primera propiedad para atraer interesados.</p>
          <button class="boton_publicar_vacio" onclick="ir_a_publicar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Publicar mi primer inmueble
          </button>
        </div>

        <!-- Estado de carga -->
        <div id="estado_carga" class="estado_carga oculto" role="status">
          <div class="circulo_carga"></div>
          <p>Cargando tus inmuebles...</p>
        </div>
      </section>

    </main>

  </div>

  <!-- Contenedor notificaciones -->
  <div id="contenedor_notificaciones" class="contenedor_notificaciones" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="../javascript/main.js"></script>
  <script src="../javascript/global_function.js"></script>

</body>
</html>
