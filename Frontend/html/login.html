<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Rever Inmobiliaria</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="contenedor_principal">
        <div class="columna_izquierda">
            <div class="contenedor_formulario">
                <h1 class="titulo_marca">Rever Inmobiliaria</h1>
                <p class="texto_bienvenida">Bienvenido de vuelta</p>
                
                <form class="formulario_login">
                    <div class="grupo_campo">
                        <label for="correo_electronico" class="etiqueta_campo">Correo Electrónico</label>
                        <input type="email" id="correo_electronico" class="campo_entrada" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="grupo_campo">
                        <label for="contrasena" class="etiqueta_campo">Contraseña</label>
                        <input type="password" id="contrasena" class="campo_entrada" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="boton_principal">Iniciar Sesión</button>
                </form>
                
                <div class="separador">
                    <span class="texto_separador">o continúa con</span>
                </div>
                
                <button class="boton_google">
                    <svg class="icono_google" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                
                <div class="enlaces_formulario">
                    <a href="#" class="enlace_olvido_contrasena">¿Olvidaste tu contraseña?</a>
                    <a href="registro.html" class="enlace_registro">¿No tienes una cuenta? <span class="texto_dorado">Regístrate aquí</span></a>
                </div>
                
                <p class="texto_copyright">© 2026 Rever Inmobiliaria. Todos los derechos reservados.</p>
            </div>
        </div>
        
        <div class="columna_derecha">
            <div class="contenedor_imagen">
                <div class="superposicion_texto">
                    <h2 class="titulo_imagen">Encuentra tu hogar ideal</h2>
                    <p class="subtitulo_imagen">Gestionamos propiedades excepcionales para ti</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
